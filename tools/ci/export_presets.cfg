[preset.3.options]

custom_template/debug=""
custom_template/release=""
; No Gradle: the prebuilt template APK is enough for a sideloaded build. arm64 only.
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; Signed from the GODOT_ANDROID_KEYSTORE_RELEASE_* env (repo secrets), never stored here.
keystore/release=""
keystore/release_user=""
keystore/release_password=""
; release.sh stamps both from the semver (code = major*10000 + minor*100 + patch).
version/code=1
version/name=""
package/unique_name="ch.unitsport.switzerland"
package/name="UnitSport Switzerland"
package/signed=true
screen/immersive_mode=true
permissions/access_network_state=true
permissions/access_wifi_state=true
permissions/change_wifi_multicast_state=true
permissions/internet=true
permissions/vibrate=true
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
