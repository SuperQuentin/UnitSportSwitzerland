; Export presets for the CI release (.github/workflows/release.yml copies this to the repo root).
; The root export_presets.cfg is gitignored because it is per machine; this one is committed so a
; runner needs no setup. exclude_filter matches the "Linux Server" preset in tools/deploy-linux.sh:
; the data folders are generated, never shipped. modify_resources=false keeps rcedit out of the
; Windows export; script_export_mode=2 ships compiled assemblies without the C# sources.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="terrain_chunks/*, terrain_chunks_png/*, terrain_chunks_temp/*, ressources/*, roadgen_out/*, video/*, graphify-out/*, tools/*"
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=false
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="UnitSport"
application/product_name="UnitSportSwitzerland"
application/file_description=""
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

