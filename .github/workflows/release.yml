# A release per merged pull request, coalesced: a burst of merges yields one release covering all of them,
# and at most one release per hour (later merges wait for the hour to pass, then ship together).
# Free on this repo (public -> unlimited standard-runner minutes). Background: docs/notes/general/release-on-merge.md
name: Release

on:
  # pull_request_target, not pull_request: the closed event then carries a write token even when the
  # merged PR came from a fork, and nothing from the PR branch is ever checked out (we build main's tip).
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the next version and changelog without releasing
        type: boolean
        default: false
      quiet_minutes:
        description: Minutes main must sit still before the build starts
        default: "3"
      min_gap_minutes:
        description: Minutes that must pass since the latest release (0 releases right away)
        default: "60"
      android_only:
        description: Build only the Android APK (a run artifact), without releasing
        type: boolean
        default: false

# One release at a time. Queued, never cancelled: a cancel could land between "gh release create"
# and the asset upload and leave a release with no downloads. Superseded runs exit early instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 150 # up to 60m of gap + 50m of merge cap + the ~5-10m build
    env:
      GODOT_VERSION: 4.7.1-stable
      GODOT: ${{ github.workspace }}/.godot-ci/godot
      QUIET_MINUTES: ${{ inputs.quiet_minutes || '3' }}
      MIN_GAP_MINUTES: ${{ inputs.min_gap_minutes || '60' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.android_only && github.ref || 'main' }} # an APK check builds the branch it was started from
          fetch-depth: 0      # release.sh needs the tags and the full log for the changelog
          lfs: false          # assets/**/*.{png,glb,...} are docs material, excluded from the export;
                              # keeping LFS out holds this to zero metered LFS bandwidth

      # A burst of merges (six in half an hour is normal here) should produce one release, not six:
      # settle-main.sh waits for main to sit still and for an hour to pass since the latest release,
      # and stops early if its tip is already released.
      - name: Wait for main to settle
        id: settle
        if: ${{ !inputs.android_only }}
        run: tools/ci/settle-main.sh

      - name: Set up .NET
        if: steps.settle.outputs.skip != '1'
        uses: actions/setup-dotnet@v4
        with:
          # 8: UnitSportSwitzerland.csproj TargetFramework; 9: its Android build (Godot's APK template runs net9.0)
          dotnet-version: |
            8.0.x
            9.0.x

      # 1.15 GB of export templates: cached, or every release would re-download them.
      - name: Cache Godot and its export templates
        if: steps.settle.outputs.skip != '1'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            .godot-ci
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Install Godot ${{ env.GODOT_VERSION }} mono
        if: steps.settle.outputs.skip != '1' && steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/ci/install-godot.sh

      - name: Install the CI export presets
        if: steps.settle.outputs.skip != '1'
        run: cp tools/ci/export_presets.cfg export_presets.cfg

      # The APK's signing key (#544), from repo secrets; without them release.sh skips the APK.
      # The runner image already has the Android SDK (ANDROID_HOME) and JDK 17 (JAVA_HOME).
      - name: Android release keystore
        if: steps.settle.outputs.skip != '1'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else echo "No ANDROID_KEYSTORE_BASE64 secret: this release ships no APK"; fi

      # Godot reports only "Username and/or Password is invalid"; keytool's own message says which (no secret printed)
      - name: Check the keystore credentials (APK check only)
        if: inputs.android_only
        env:
          KS_USER: ${{ vars.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "JAVA_HOME=$JAVA_HOME"; "$JAVA_HOME/bin/keytool" -version 2>&1 || true
          grep -h java_sdk_path ~/.config/godot/editor_settings-*.tres 2>/dev/null || echo "no editor settings yet (seeded at export)"
          "$JAVA_HOME/bin/keytool" -list -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$KS_PASS" -alias "$KS_USER" 2>&1 | sed -E 's/([0-9A-F]{2}:){8,}[0-9A-F]{2}/<fingerprint>/' || true
          echo "--- all aliases:"; "$JAVA_HOME/bin/keytool" -list -keystore "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" -storepass "$KS_PASS" 2>&1 | grep -E 'Entry|error|Keystore type' || true

      - name: Release
        if: steps.settle.outputs.skip != '1'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ vars.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        # via bash: tools/release.sh is mode 644 in the index, like most of tools/
        run: bash tools/release.sh --ci ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.android_only && '--android-only' || '' }}

      - name: Keep the logs and notes
        if: always() && steps.settle.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            test_output/release/notes.md
            test_output/release/subjects.txt
            test_output/release/*.apk
          if-no-files-found: ignore
